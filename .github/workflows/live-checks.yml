# Ночная проверка живых ответов сетей.
#
# Тесты работают на СНЯТЫХ фикстурах, и потому молчат, когда сеть меняет
# ответ: вчерашняя фикстура проходит, а сеть уже отдаёт другое. Этот прогон
# бьёт по живым адресам и падает, когда сеть уехала НАСТОЯЩИМ образом.
#
# Что проверяется:
#  • код точки Магнита принимается сетью (иначе опрос города молча встаёт);
#  • карточка товара Магнита по-прежнему несёт JSON-LD с ценой (на этом стоит
#    HTML-фолбэк карточки — без него опрос товаров не собрал бы цену);
#  • ФОРМА ответа webgate не поехала: сравнивается набор ключей и их типы
#    (tests/fixtures/magnit-webgate-shape.json), а не живые значения — цены,
#    остатки и порядок товаров меняются ежедневно, и «форма уехала» не
#    отличить от «цена изменилась».
#
# Сеть у Магнита бывает занята (503/504 — её зафиксированное состояние), и
# это НЕ поломка проекта: зонды различают «сеть не ответила» (зелёный с
# предупреждением) и «сеть ответила, но ответ уехал» (красный).
#
# Расписание: раз в сутки в 04:10 UTC. Сеть режет запросы подряд, поэтому
# шаги идут с паузами и по одному.
name: Live checks

on:
  schedule:
    - cron: '10 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-checks
  cancel-in-progress: false

jobs:
  magnit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Код точки Магнита принимается сетью
        # Зонд сам различает «сеть не ответила» (код 0 с предупреждением) и
        # «точка уехала» (код 1) — красным будет только второе.
        run: npm run magnit:store -- 303857

      - name: Карточка товара несёт JSON-LD с ценой
        # Тоже самое: сеть не ответила — код 0, форма уехала — код 4.
        run: npm run magnit:card

      - name: Форма ответа webgate не поехала
        # Сравнивается ТОЛЬКО форма (набор ключей и их типы), а не живые
        # значения: цены, остатки и порядок товаров меняются ежедневно, и «форма
        # уехала» было бы не отличить от «цена изменилась». Значения
        # переснимаются рядом и показываются diff'ом, но не роняют проверку.
        run: |
          npm run magnit:fixture
          git --no-pager diff --stat -- tests/fixtures/magnit-webgate-search.json
          # Файл формы должен быть в индексе: `git diff` не смотрит на
          # неотслеживаемые файлы, и проверка была бы вечно зелёной.
          git ls-files --error-unmatch tests/fixtures/magnit-webgate-shape.json
          git diff --exit-code -- tests/fixtures/magnit-webgate-shape.json

      - name: Диагностика при падении
        if: failure()
        run: |
          Write-Host "Магнит отвечает иначе, чем ждали. Проверьте живой ответ:" -ForegroundColor Yellow
          Write-Host "  npm run magnit:store -- 303857" -ForegroundColor Yellow
          Write-Host "  npm run magnit:card" -ForegroundColor Yellow
          Write-Host "  npm run magnit:fixture" -ForegroundColor Yellow
