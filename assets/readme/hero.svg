<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 436" width="1200" height="436" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">PriceAggregator — локальный агрегатор цен шести сетей по конкретному магазину и городу</title>
  <desc id="heroDesc">Слева название и суть проекта: цены по конкретному магазину и городу, 6 сетей, 30 городов, 16 полок. Справа фрагмент интерфейса: город, шесть выбранных сетей, дерево наших полок с иконками, цены по сетям, зачёркнутая старая цена и спарклайн истории.</desc>

  <!-- Палитра и геометрия взяты из самого приложения (src/renderer/index.css):
       фон-кремовый, карточка белая, primary #059669, линия #d8efe8, чернила
       #0f172a, приглушённый #475569. Ничего изобразительного: это те же цвета
       и тот же радиус, что видит пользователь в окне. -->
  <rect width="1200" height="436" fill="#ecfdf5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <!-- ЛЕВАЯ КОЛОНКА: кто это и зачем -->
    <text x="60" y="88" font-family="'SF Mono', 'Cascadia Mono', Consolas, monospace" font-size="16" fill="#475569" letter-spacing="0.6">ЛОКАЛЬНЫЙ АГРЕГАТОР ЦЕН · ELECTRON · WINDOWS</text>

    <text x="60" y="172" font-size="64" font-weight="700" fill="#0f172a" letter-spacing="-1.6">PriceAggregator</text>
    <rect x="60" y="196" width="64" height="6" rx="3" fill="#059669"/>

    <text x="60" y="236" font-size="22" fill="#475569">Цены шести сетей — по конкретному</text>
    <text x="60" y="266" font-size="22" fill="#475569">магазину и городу, а не «в среднем</text>
    <text x="60" y="296" font-size="22" fill="#475569">по городу».</text>

    <!-- Три факта вместо обещаний: сети, города, полки -->
    <g>
      <text x="60" y="348" font-size="34" font-weight="700" fill="#059669">6</text>
      <text x="60" y="370" font-size="18" fill="#475569">сетей</text>

      <text x="176" y="348" font-size="34" font-weight="700" fill="#059669">30</text>
      <text x="176" y="370" font-size="18" fill="#475569">городов</text>

      <text x="304" y="348" font-size="34" font-weight="700" fill="#059669">16</text>
      <text x="304" y="370" font-size="18" fill="#475569">полок</text>
    </g>

    <!-- Коды магазинов — настоящая техническая деталь проекта, а не украшение.
         Москва 2026-11-11: по одному коду на сеть, все шесть рабочие. -->
    <text x="60" y="410" font-family="'SF Mono', 'Cascadia Mono', Consolas, monospace" font-size="18" fill="#475569">Москва: 35XY · 303857 · 4161 · 820 · HD87 · 2053</text>
  </g>

  <!-- ПРАВАЯ КОЛОНКА: реальный фрагмент интерфейса.
       Иконки полок — те же пути, что в src/renderer/CategoryIcon.tsx,
       масштабированы с 24 на 32. -->
  <g>
    <rect x="612" y="32" width="548" height="360" rx="18" fill="#ffffff" stroke="#d8efe8" stroke-width="2"/>

    <!-- Шапка карточки: город и выбранные сети. Чипов шесть, они не помещаются
         в одну строку — в приложении та же строка переносится, здесь вторая
         строка чипов стоит под первой. -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
      <text x="640" y="76" font-size="20" font-weight="600" fill="#0f172a">Москва</text>
      <g>
        <rect x="864" y="52" width="79" height="30" rx="15" fill="#ffffff" stroke="#d8efe8" stroke-width="2"/>
        <text x="903.5" y="73" font-size="18" fill="#047857" text-anchor="middle">Магнит</text>
        <rect x="953" y="52" width="70" height="30" rx="15" fill="#ffffff" stroke="#d8efe8" stroke-width="2"/>
        <text x="988" y="73" font-size="18" fill="#047857" text-anchor="middle">Лента</text>
        <rect x="1033" y="52" width="99" height="30" rx="15" fill="#ffffff" stroke="#d8efe8" stroke-width="2"/>
        <text x="1082.5" y="73" font-size="18" fill="#047857" text-anchor="middle">Светофор</text>

        <rect x="814" y="90" width="70" height="30" rx="15" fill="#ffffff" stroke="#d8efe8" stroke-width="2"/>
        <text x="849" y="111" font-size="18" fill="#047857" text-anchor="middle">Чижик</text>
        <rect x="894" y="90" width="109" height="30" rx="15" fill="#ffffff" stroke="#d8efe8" stroke-width="2"/>
        <text x="948.5" y="111" font-size="18" fill="#047857" text-anchor="middle">Пятёрочка</text>
        <rect x="1013" y="90" width="119" height="30" rx="15" fill="#ffffff" stroke="#d8efe8" stroke-width="2"/>
        <text x="1072.5" y="111" font-size="18" fill="#047857" text-anchor="middle">Перекрёсток</text>
      </g>
      <line x1="640" y1="134" x2="1132" y2="134" stroke="#d8efe8" stroke-width="2"/>
    </g>

    <!-- Строка полки: иконка, название, цены по сетям.
         Иконка рисуется через <g transform="translate(x,y) scale(0.0333)"> —
         960 юнитов сетки набора превращаются в 32 px (h-8 w-8 в приложении),
         а внутри — та же нормализация оптики, что и в приложении (общий кадр и
         общая нижняя кромка). Смещение translate подобрано так, чтобы
         оптический центр ИКОНКИ совпал с визуальным центром строки текста
         (baseline − 0.35·fontsize). Всё это пересобирает
         `npm run icons:fetch` — руками файл не правится. -->
    <!-- 1. Молочное -->
    <g transform="translate(640,161) scale(1.3333)">
      <g transform="translate(4 1.3333333333333357) scale(0.04167)"><path d="M192 496C86 496 0 394 0 288 0 176 64 16 192 16S384 176 384 288c0 106-86 208-192 208zM154.8 134c6.5-6 7-16.1 1-22.6s-16.1-7-22.6-1c-23.9 21.8-41.1 52.7-52.3 84.2-11.2 31.6-16.9 65.1-16.9 93.5 0 8.8 7.2 16 16 16s16-7.2 16-16c0-24.5 5-54.4 15.1-82.8 10.1-28.5 25-54.1 43.7-71.2z" fill="#059669"/></g>
    </g>
    <text x="690" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#0f172a">Молочное и яйца</text>
    <text x="1010" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#475569" text-anchor="end">Магнит</text>
    <text x="1132" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a" text-anchor="end">79,99 ₽</text>
    <line x1="640" y1="200" x2="1132" y2="200" stroke="#d8efe8" stroke-width="1.5"/>

    <!-- 2. Хлеб и выпечка: цена шестой сети — Перекрёстока -->
    <g transform="translate(640,211) scale(1.3333)">
      <g transform="translate(1.683088182003738 1.7027641045058672) scale(0.03786)"><path d="M79.7 234.6c6.2-4.1 14.7-3.4 20.1 2.1l46.1 46.1 6.1 6.7c19.7 23.8 26.3 55 19.2 83.9 31.7-7.7 66.2 1 90.6 25.3l46.1 46.1c6.2 6.2 6.2 16.4 0 22.6l-7.4 7.4c-37.5 37.5-98.3 37.5-135.8 0L134.1 444.3 49.4 529c-9.4 9.4-24.5 9.4-33.9 0-9.4-9.4-9.4-24.6 0-33.9l84.7-84.7-30.5-30.5c-37.5-37.5-37.5-98.3 0-135.7l7.4-7.4 2.5-2.1zm104-104c6.2-4.1 14.7-3.4 20.1 2.1l46.1 46.1 6.1 6.7c19.7 23.8 26.3 55 19.2 83.9 31.7-7.7 66.2 1 90.6 25.3l46.1 46.1c6.2 6.2 6.2 16.4 0 22.6l-7.4 7.4c-37.5 37.5-98.3 37.5-135.8 0l-94.9-94.9c-37.5-37.5-37.5-98.3 0-135.7l7.4-7.4 2.5-2.1zM495.2 15c9.4-9.4 24.6-9.4 34 0 8.8 8.8 9.3 22.7 1.6 32.2L529.2 49 414.7 163.4c7.7 1 15.2 3 22.5 5.9L495.5 111c9.4-9.4 24.6-9.4 34 0 8.8 8.8 9.3 22.7 1.6 32.1l-1.7 1.8-52.7 52.7 39 39c6.2 6.2 6.2 16.4 0 22.6l-7.4 7.4c-37.5 37.5-98.3 37.5-135.8 0l-94.9-94.9c-37.5-37.5-37.5-98.3 0-135.7l7.4-7.4 2.5-2.1c6.2-4.1 14.7-3.4 20.1 2.1l39 39 52.7-52.7c9.4-9.4 24.6-9.4 34 0 8.8 8.8 9.3 22.7 1.6 32.1l-1.7 1.8-58.3 58.3c2.8 7.1 4.7 14.5 5.7 22.1L495.2 15z" fill="#059669"/></g>
    </g>
    <text x="690" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#0f172a">Хлеб и выпечка</text>
    <text x="1010" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#475569" text-anchor="end">Перекрёсток</text>
    <text x="1132" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a" text-anchor="end">42,90 ₽</text>
    <line x1="640" y1="250" x2="1132" y2="250" stroke="#d8efe8" stroke-width="1.5"/>

    <!-- 3. Мясо: снижение цены. Строка собрана как в приложении (App.tsx:2600-2612):
         подпись сети прижата к 1010, старая цена зачёркнута приглушённым и мелким
         кеглем, новая — жирными чернилами. Бейджа в приложении нет, и белым по
         primary он был бы 3.77:1 — ниже AA, поэтому цена здесь ink, не зелёная. -->
    <g transform="translate(640,261) scale(1.3333)">
      <g transform="translate(2 7.930304167862774) scale(0.03141)"><path d="M96 224l0 192c0 17.7 14.3 32 32 32l32 0c17.7 0 32-14.3 32-32l0-88.2c9.9 6.6 20.6 12 32 16.1l0 24.2c0 8.8 7.2 16 16 16s16-7.2 16-16l0-16.9c5.3 .6 10.6 .9 16 .9s10.7-.3 16-.9l0 16.9c0 8.8 7.2 16 16 16s16-7.2 16-16l0-24.2c11.4-4 22.1-9.4 32-16.1l0 88.2c0 17.7 14.3 32 32 32l32 0c17.7 0 32-14.3 32-32l0-160 32 32 0 49.5c0 9.5 2.8 18.7 8.1 26.6L530 427c8.8 13.1 23.5 21 39.3 21 22.5 0 41.9-15.9 46.3-38l20.3-101.6c2.6-13-.3-26.5-8-37.3l-3.9-5.5 0-81.6c0-13.3-10.7-24-24-24s-24 10.7-24 24l0 14.4-52.9-74.1C496 86.5 452.4 64 405.9 64L144 64C77.7 64 24 117.7 24 184l0 54C9.4 249.8 0 267.8 0 288l0 17.6c0 8 6.4 14.4 14.4 14.4 31.8 0 57.6-25.8 57.6-57.6L72 184c0-24.3 12.1-45.8 30.5-58.9-4.2 10.8-6.5 22.6-6.5 34.9l0 64zM560 336a16 16 0 1 1 32 0 16 16 0 1 1 -32 0zM166.6 166.6c-4.2-4.2-6.6-10-6.6-16 0-12.5 10.1-22.6 22.6-22.6l178.7 0c12.5 0 22.6 10.1 22.6 22.6 0 6-2.4 11.8-6.6 16l-23.4 23.4C332.2 211.8 302.7 224 272 224s-60.2-12.2-81.9-33.9l-23.4-23.4z" fill="#059669"/></g>
    </g>
    <text x="690" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#0f172a">Мясо и птица</text>
    <text x="1010" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#475569" text-anchor="end">Магнит</text>
    <text x="1066" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#475569" text-anchor="end" text-decoration="line-through">349 ₽</text>
    <text x="1132" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="end">299 ₽</text>
    <line x1="640" y1="300" x2="1132" y2="300" stroke="#d8efe8" stroke-width="1.5"/>

    <!-- 4. Овощи и фрукты -->
    <g transform="translate(640,311) scale(1.3333)">
      <g transform="translate(-0.32367832415618203 3.494357127580656) scale(0.03614)"><path d="M453.1-36.7L440.9-24.6c-31.2 31.2-31.2 81.9 0 113.1 15.6 15.6 31.2 31.2 46.9 46.9 31.2 31.2 81.9 31.2 113.1 0l12.1-12.1c6.2-6.2 6.2-16.4 0-22.6L600.9 88.6c-31.2-31.2-81.9-31.2-113.1 0 31.2-31.2 31.2-81.9 0-113.1L475.7-36.7c-6.2-6.2-16.4-6.2-22.6 0zM331.6 96c-45.2 0-87.1 20.4-115 54.3L273.3 207c9.4 9.4 9.4 24.6 0 33.9s-24.6 9.4-33.9 0L191.6 193.2 67.2 466.8c-5.5 12.1-2.9 26.4 6.5 35.9s23.7 12 35.9 6.5l141.6-64.4-43.8-43.8c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0l56.5 56.5 95.3-43.3c53.1-24.1 87.2-77.1 87.2-135.5 0-82.2-66.6-148.8-148.8-148.8z" fill="#059669"/></g>
    </g>
    <text x="690" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#0f172a">Овощи</text>
    <text x="1010" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#475569" text-anchor="end">Магнит</text>
    <text x="1132" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a" text-anchor="end">129,99 ₽</text>
    <line x1="640" y1="350" x2="1132" y2="350" stroke="#d8efe8" stroke-width="1.5"/>

    <!-- Подвал карточки: правило записи в историю и график.
         Спарклайн нарисован реальными точками: чем ровнее линия, тем меньше
         записей — ровно то поведение, которое отличает проект от
         «пишем каждый опрос». -->
    <g>
      <text x="640" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#475569">в историю — только при изменении</text>
      <polyline points="962,380 985,370 1008,376 1031,362 1054,368 1077,356 1103,362 1128,356"
        fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="1128" cy="356" r="6" fill="#059669"/>
    </g>
  </g>
</svg>